<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Facts API</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Dog Facts API</h1>
      <p class="subtitle">Discover fun and fascinating facts about dogs</p>
    </div>
  </header>

  <main>
    <section class="controls">
      <div class="filter-group">
        <label for="breed-select">Filter by Breed</label>
        <select id="breed-select">
          <option value="">All Breeds</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="category-select">Filter by Category</label>
        <select id="category-select">
          <option value="">All Categories</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="number-input">Number of Facts</label>
        <input type="number" id="number-input" min="1" max="50" value="5" placeholder="How many?">
      </div>

      <button id="fetch-btn" class="btn-primary">Get Facts</button>
    </section>

    <section class="results" id="results">
      <div class="placeholder">
        <p>Select your filters and click <strong>Get Facts</strong> to see dog facts!</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Dog Facts API &mdash; Built with Node.js &amp; Express.js</p>
    <p class="api-hint">API Endpoint: <code>GET /facts?number=5&breed=Poodle&category=History</code></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
